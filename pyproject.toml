[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog"
version = "1.1.0"
description = "Terminal-based task manager built with Textual TUI"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0",
]

[project.scripts]
backlog = "backlog.__main__:main"

[tool.setuptools.package-dir]
backlog = "src"

[tool.setuptools.packages.find]
where = ["."]
include = ["backlog*"]
